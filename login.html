<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kaivora</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-image: url('https://i.pinimg.com/1200x/26/c5/41/26c5418768e4d0cd2cfaad1f5c5934d9.jpg');
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: black;
      padding: 35px;
      width: 350px;
      border-radius: 12px;
      text-align: center;
      color: white;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .logo {
      color: skyblue;
      padding: 60px;
      width: 60px;
      height: 50px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .password-container {
      position: relative;
    }

    .toggle-eye {
      position: absolute;
      right: 12px;
      top: 15px;
      cursor: pointer;
      color: black;
      background: white;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 12px;
    }

    .login-btn {
      background: #ffdd57;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      color: black;
      display: inline-block;
    }

    .login-btn:hover {
      background: #ffe580;
    }
  </style>
</head>

<body style="background-image: url('https://i.pinimg.com/1200x/63/f5/c5/63f5c5f2aa2b40b04eaa64c58f32de71.jpg');">
  <div class="login-box">
    <div class="logo">
      <img src="https://i.pinimg.com/1200x/09/67/33/096733968aed5289fad59ef4c59877d2.jpg" alt="Kaivora Logo">
      <span>KAIVORA</span>
    </div>

    <h2>Welcome Explorer</h2>

    <input id="username" type="text" placeholder="Enter Username">

    <div class="password-container">
      <input id="password" type="password" placeholder="Enter Password">
      <span class="toggle-eye" onclick="togglePassword()">👁</span>
    </div>
     <a href="index.html" id="homeLink">Home</a>

    <a href="#" onclick="validateLogin()" class="login-btn">Login</a>
  </div>
`
  <script>
    function togglePassword() {
      const pass = document.getElementById("password");
       if (pass.type === "password") {
        pass.type = "text";
      } else {
        pass.type = "password";
      }
    }
    function validateLogin() {
      let user = document.getElementById("username").value;
      let pass = document.getElementById("password").value;

      if (user === "" || pass === "") {
        alert("Please enter both Username and Password!");
      } else {
        document.getElementById("homeLink").click();
      }
    }
  </script>

</body>
</html>
